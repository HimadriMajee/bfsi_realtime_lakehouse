# ==================================================================================================
# BFSI REAL-TIME DATA LAKEHOUSE: GITHUB ACTIONS CI/CD PIPELINE
# ==================================================================================================
# File Name : .github/workflows/pipeline_ci.yml
# Purpose   : Automated build, static code quality linting, and PyTest execution on every push or PR.
# ==================================================================================================

name: BFSI Real-Time Lakehouse CI/CD Pipeline          # Display name in GitHub Actions tab

# --------------------------------------------------------------------------------------------------
# TRIGGER EVENTS
# --------------------------------------------------------------------------------------------------
on:
  push:
    branches: [ "main" ]                                # Trigger workflow automatically on push to main branch
  pull_request:
    branches: [ "main" ]                                # Trigger workflow on pull requests targeting main branch

# --------------------------------------------------------------------------------------------------
# PIPELINE JOBS DEFINITION
# --------------------------------------------------------------------------------------------------
jobs:
  build-and-test:
    runs-on: ubuntu-latest                             # Execute on GitHub-hosted Ubuntu 22.04 runner machine

    steps:
    # STEP 1: CHECKOUT REPOSITORY CODE
    - name: Checkout Source Code
      uses: actions/checkout@v3                        # Pull repository source code into runner workspace

    # STEP 2: CONFIGURE JAVA ENVIRONMENT (REQUIRED FOR PYSPARK)
    # INDUSTRY PRACTICE: PySpark requires a compatible JDK runtime (JDK 17) to launch JVM driver engines.
    - name: Set up Java 17 (Temurin OpenJDK)
      uses: actions/setup-java@v3
      with:
        java-version: '17'                             # Specify JDK 17 to match production deployment
        distribution: 'temurin'                        # Eclipse Temurin distribution

    # STEP 3: CONFIGURE PYTHON ENVIRONMENT
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'                         # Target Python version matching local virtual environment

    # STEP 4: INSTALL DEPENDENCIES
    # INDUSTRY PRACTICE: Cache or pin dependency versions in CI to ensure deterministic builds.
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 pyspark==3.5.0 delta-spark==3.1.0 python-dotenv

    # STEP 5: STATIC CODE QUALITY & LINTING CHECK
    # INDUSTRY PRACTICE: Enforce PEP8 compliance and flag critical syntax/import errors prior to testing.
    - name: Code Quality Linting (Flake8)
      run: |
        # Stop build if there are syntax errors or undefined name references
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat remaining PEP8 formatting warnings without failing the entire build
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # STEP 6: EXECUTE UNIT TEST SUITE
    - name: Run PyTest Transformation Unit Tests
      run: |
        pytest python/tests/ -v                       # Execute unit tests with verbose console output